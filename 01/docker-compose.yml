
services:
  testapp:
    build: .
    image: testapp:latest
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - redis
      - mongo
    environment:
      MONGO_URI: "mongodb://admin:123@mongo:27017/myDatabase?authSource=admin"
      REDIS_HOST: redis
      REDIS_PORT: 6379

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=123

volumes:
  mongo-data:
